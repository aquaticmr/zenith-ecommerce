spring:
  application:
    name: Ecommerce
  datasource:
    # These variables are automatically provided by Railway's MySQL service
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
          github:
            client-id: ${GITHUB_ID}
            client-secret: ${GITHUB_SECRET}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwtSecret: ${JWT_SECRET}
  cloudinary:
    cloud-name: ${CLOUDINARY_NAME}
    api-key: ${CLOUDINARY_KEY}
    api-secret: ${CLOUDINARY_SECRET}
  gemini:
    api-key: ${GEMINI_KEY}
